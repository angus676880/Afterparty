<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>派對邀請函 🎉</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <!-- ===== Hero ===== -->
  <header class="hero">
    <div class="confetti-layer" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="hero__inner">
      <p class="hero__pre">你收到了一封</p>
      <h1 class="hero__title" data-text="After Party 邀請函">After Party 邀請函</h1>
      <p class="hero__subtitle">We're throwing a party &amp; you're on the list!</p>
    </div>
  </header>

  <main>

    <!-- ===== 活動資訊 ===== -->
    <section class="event-info reveal" aria-labelledby="event-heading">
      <h2 id="event-heading" class="section-title">活動資訊</h2>
      <div class="info-grid">
        <article class="info-card">
          <div class="info-card__icon" aria-hidden="true">📅</div>
          <h3 class="info-card__label">日期</h3>
          <p class="info-card__value">2026 - 10 - 25 （日）</br>隔天國定假日哦!</p>
        </article>
        <article class="info-card">
          <div class="info-card__icon" aria-hidden="true">🕖</div>
          <h3 class="info-card__label">時間</h3>
          <p class="info-card__value">晚上 10:00 開始</p>
        </article>
        <article class="info-card">
          <div class="info-card__icon" aria-hidden="true">📍</div>
          <h3 class="info-card__label">地點</h3>
          <p class="info-card__value">台中市區待定</p>
        </article>
        <article class="info-card">
          <div class="info-card__icon" aria-hidden="true">👗</div>
          <h3 class="info-card__label">著裝</h3>
          <p class="info-card__value">開心就好</p>
        </article>
      </div>
    </section>

    <!-- ===== RSVP 表單 ===== -->
    <section class="rsvp reveal" aria-labelledby="rsvp-heading">
      <h2 id="rsvp-heading" class="section-title">RSVP 報名</h2>
      <p class="rsvp__desc">請在 <strong>2026 年 8 月 15 日</strong>前完成報名，名額有限！</p>

      <form
        id="rsvp-form"
        class="rsvp-form"
        novalidate
        aria-label="派對報名表單"
      >
        <div class="form-group">
          <label for="field-name">姓名 <span class="required" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="field-name"
            name="entry.1642578712"
            placeholder="你的大名"
            required
            autocomplete="name"
          />
          <span class="field-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="field-guests">攜伴人數（含本人）<span class="required" aria-hidden="true">*</span></label>
          <select id="field-guests" name="entry.2122523921" required>
            <option value="">請選擇</option>
            <option value="1">1 人（只有我）</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人以上</option>
          </select>
          <span class="field-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="field-message">許願池</label>
          <textarea
            id="field-message"
            name="entry.858548670"
            rows="3"
            placeholder="有什麼想說的？"
          ></textarea>
        </div>

        <button type="submit" class="btn-submit">
          <span class="btn-submit__text">送出報名 🎊</span>
          <span class="btn-submit__loading" aria-hidden="true">送出中…</span>
        </button>
      </form>

      <!-- 送出成功提示 -->
      <div id="rsvp-success" class="rsvp-success" hidden aria-live="polite">
        <div class="rsvp-success__icon" aria-hidden="true">🎉</div>
        <h3>報名成功！</h3>
        <p>我們收到你的報名了，期待在派對上見到你！</p>
      </div>

      <!-- 隱藏 iframe，用於攔截 Google 表單跳轉 -->
      <iframe
        id="hidden-iframe"
        name="hidden-iframe"
        style="display:none"
        title="表單送出用途"
        aria-hidden="true"
      ></iframe>
    </section>

  </main>

  <footer class="site-footer">
    <p>有任何問題請聯絡主辦方</p>
  </footer>

  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/effects.js" defer></script>
</body>
</html>
